<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ExpTrack: tomato tile with a spending ring -->
  <rect width="64" height="64" rx="16" fill="#F3543B"/>
  <g fill="none" stroke-width="9" transform="rotate(-90 32 32)">
    <!-- circumference = 2π·16 ≈ 100.5 -->
    <circle cx="32" cy="32" r="16" stroke="#FFFFFF" stroke-opacity="0.25"/>
    <circle cx="32" cy="32" r="16" stroke="#FEC93C" stroke-dasharray="46 100.5"/>
    <circle cx="32" cy="32" r="16" stroke="#FFFFFF" stroke-dasharray="28 100.5" stroke-dashoffset="-49"/>
    <circle cx="32" cy="32" r="16" stroke="#0F241A" stroke-dasharray="17 100.5" stroke-dashoffset="-80"/>
  </g>
</svg>
