databases:
  - name: expense-tracker-db
    databaseName: expensetracker
    plan: free

services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: expense-tracker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: expense-tracker-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: expense-tracker-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: expense-tracker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: expense-tracker-db
          property: password
      - key: FRONTEND_URL
        value: https://deeprajsawaiyan.github.io
      # Base URL for links in emails (password reset)
      - key: FRONTEND_BASE_URL
        value: https://deeprajsawaiyan.github.io/ExpenseTrackerApi
      # Password reset emails. Render's FREE plan blocks outbound SMTP (ports 25/465/587),
      # so on free instances use Brevo's HTTP API: set BREVO_API_KEY and MAIL_FROM (a sender
      # verified in Brevo). The MAIL_HOST/USERNAME/PASSWORD SMTP settings only work on paid instances.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
