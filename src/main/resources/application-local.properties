# Local profile — embedded H2 database, no MySQL needed.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Data is stored in ./data/expensetracker.mv.db and survives restarts.
spring.datasource.url=jdbc:h2:file:./data/expensetracker;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optional SMTP settings for real reset emails when running locally.
# Copy local-mail.properties.example to local-mail.properties (git-ignored) and fill it in.
# Without that file, reset links are printed to the console instead of emailed.
spring.config.import=optional:file:./local-mail.properties

# Local testing only: print reset links to the console when they aren't emailed
# (email not configured, or sending failed). Never enable this in production.
app.mail.log-links=true
