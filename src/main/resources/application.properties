# Server (Render sets PORT dynamically)
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# Database — local MySQL defaults; override on Render via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/expensetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:your-secret-key}

# CORS — production frontend origin (e.g. https://deeprajsawaiyan.github.io)
frontend.url=${FRONTEND_URL:}

# Full frontend base URL used to build links in emails (include the GitHub Pages path in production,
# e.g. https://deeprajsawaiyan.github.io/ExpenseTrackerApi)
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.password-reset.token-validity-minutes=30

# Email (SMTP) for password reset. Leave MAIL_HOST empty locally: the reset link is printed
# to the console instead of being emailed. Gmail example: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
# MAIL_USERNAME=you@gmail.com, MAIL_PASSWORD=<16-char app password>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@expensetracker.local}}
app.mail.from-name=ExpTrack

# Brevo HTTP email API (https://www.brevo.com) — use this on hosts that block SMTP ports,
# e.g. Render's free tier. When set it takes priority over SMTP. MAIL_FROM must be a sender
# address verified in Brevo.
app.mail.brevo-api-key=${BREVO_API_KEY:}
